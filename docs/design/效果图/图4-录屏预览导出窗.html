.trim .tl i{flex:1;border-radius:3px;background:#1d2630}
.trim .tl i.g{background:#1e3a2f}

.trim .h.l{left:calc(12% - 5px)}.trim .h.r{right:calc(22% - 5px)}
.trim .tt{font:500 11px "JetBrains Mono",monospace;color:#8b95a1;width:96px;text-align:center}
.trim .tt b{display:block;color:#e3e1e9;font-size:13px}
.row{display:flex;align-items:center;gap:14px;margin:18px 20px 20px}
.seg{display:flex;background:#0d0f14;border:1px solid rgba(255,255,255,.1);border-radius:9px;overflow:hidden}
.seg button{padding:8px 22px;font-size:13px;font-weight:600;color:#8b95a1;background:none;border:none;cursor:pointer}
.seg button.on{background:#10b981;color:#003824}
.meta{font:500 11px "JetBrains Mono",monospace;color:#8b95a1}
.meta b{color:#4edea3}
.exp{margin-left:auto;display:flex;gap:10px}
.exp button{padding:9px 22px;border-radius:9px;font-size:13px;font-weight:600;border:1px solid rgba(255,255,255,.12);background:#1e222a;color:#e3e1e9;cursor:pointer}
.exp button.pri{background:#10b981;border-color:#10b981;color:#003824;box-shadow:0 0 16px rgba(16,185,129,.35)}
.path{margin:0 20px 18px;font:500 10.5px "JetBrains Mono",monospace;color:#68737e;display:flex;gap:6px;align-items:center}
.path b{color:#4edea3;font-weight:500}
